# httpgrl example configuration (nginx-compatible-ish syntax).
# Logs are single-line JSON on stdout.

error_log stdout info;
worker_shutdown_timeout 10s;

events {
    worker_connections 16384;
    connections_per_client 256;   # per IPv4 address / IPv6 /64
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Defence-in-depth defaults (all overridable per server/location).
    client_header_timeout 10s;    # whole request head, not per read
    client_body_timeout 30s;      # per read
    client_body_min_rate 256;     # bytes/s while blocked on the client
    send_timeout 30s;             # per write
    send_min_rate 256;            # bytes/s while blocked on the client
    keepalive_timeout 60s;
    keepalive_requests 1000;
    client_max_body_size 1m;
    large_client_header_buffers 4 8k;

    access_log stdout;
    server_tokens off;            # default: no Server header, no product name on error pages

    server {
        listen 8080 default_server;   # add "reuseport" only to share the port across processes
        listen [::]:8080 default_server;
        server_name localhost;

        root html;
        index index.html index.htm;

        location / {
            try_files $uri $uri/ =404;
        }

        location /files/ {
            autoindex on;
            autoindex_exact_size off;
        }

        location = /404.html {
            internal;
        }

        error_page 404 /404.html;

        # Reverse proxy; WebSockets work with no extra directives.
        # location /app/ {
        #     proxy_pass http://127.0.0.1:3000/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # }
    }

    # server {
    #     listen 8443 ssl;
    #     server_name example.com;
    #     ssl_certificate     certs/example.crt;
    #     ssl_certificate_key certs/example.key;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     root html;
    # }
}
