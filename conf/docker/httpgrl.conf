# Container configuration. Mount your own over /etc/httpgrl/httpgrl.conf (and content over /srv/www).
# Runs as a non-root user, so listen on an unprivileged port and map it with `-p 80:8080`.

error_log stdout info;
worker_shutdown_timeout 10s;

events {
    worker_connections 16384;
    connections_per_client 256;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log stdout;

    server {
        # IPv4 only: Docker networks usually have IPv6 disabled, and binding [::] there fails startup.
        listen 8080 default_server;
        root /srv/www;
        index index.html index.htm;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
